services:
  app:
    build: ./app
    container_name: demo_app
    ports:
      - "8082:5000"
    restart: unless-stopped
    networks:
      - observability_net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    ports:
      - "8081:9090"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - observability_net

  loki:
    image: grafana/loki:latest
    container_name: loki
    volumes:
      - ./loki/config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "8083:3100"
    restart: unless-stopped
    networks:
      - observability_net

  grafana:
    image: grafana/grafana:11.5.2
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      # Mapped to 8085 to avoid the Jenkins conflict on 8080
      - "8085:3000"
    restart: unless-stopped
    networks:
      - observability_net

  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    volumes:
      - /:/rootfs:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    command:
      - '--path.rootfs=/rootfs'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'

volumes:
  prom_data:
  loki_data:
  grafana_data:

networks:
  observability_net:
    driver: bridge
